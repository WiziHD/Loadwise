# Loadwise — jede Prüfung bei jedem Push
#
# ---------------------------------------------------------------------------
# WARUM DAS HIER STEHT UND NICHT IN EINER ERINNERUNG.
#
# Bis zu dem Tag, an dem diese Datei entstand, liefen die Tests, die
# Wortgrenze, der Prerender-Wächter und die Abdeckungsschwellen nur, wenn
# jemand daran dachte. Genau dadurch stand die
# Schwelle für `functions` unbemerkt auf Rot — niemand weiss, seit wann, weil
# `npm run coverage` in keiner Kette steckte.
#
# Dieses Projekt hat viel Mühe in Wächter gesteckt. Ein Wächter, den man
# aufrufen muss, ist kein Wächter, sondern eine Erinnerung.
#
# KEINE GEHEIMNISSE, und das ist nachgewiesen: `next build --webpack` läuft mit
# umbenannter .env.local durch, Exitcode 0. Der Grund ist eine Reihenfolge in
# lib/supabase/server.ts — `await cookies()` löst die dynamische Notbremse aus,
# BEVOR die Umgebungsvariable gelesen wird. Wer das umstellt, bricht diesen
# Ablauf. Deshalb steht es hier und nicht nur dort.
#
# Was hier absichtlich NICHT läuft:
#   check:rls   braucht den Service-Role-Key und schreibt in die echte
#               Datenbank. Ein solcher Schlüssel in CI ist der Weg, auf dem er
#               irgendwann in einem Protokoll landet. Ausserdem benutzt es
#               feste Testkonten und würde mit einem lokalen Lauf kollidieren.
#   check:signin dasselbe, plus: es braucht einen laufenden Entwicklungsserver.
#   check:verdicts dasselbe. Es legt eine Probeepisode an, schreibt Urteile mit
#               dem Service-Role-Key und loescht sie wieder. Prueft das eine,
#               was keine Attrappe kann: ob die Zeilen des Motors durch das
#               echte Schema gehen.
#   mutate      Der Wert steht bei 38 % und kann legitim erst mit echten
#               Verläufen steigen. Als Tor würde er dazu verleiten, ihn
#               künstlich zu heben.
#   tagebuch    liest eine gitignorierte CSV mit echten Gesundheitsdaten.
#
# WAS HIER GEBAUT WIRD, DARF NIE AUSGELIEFERT WERDEN. NEXT_PUBLIC_*-Werte
# werden beim Bauen in die Client-Bündel einkompiliert; ein Build ohne
# Umgebung backt dort `undefined` ein. Heute harmlos, weil kein Client-Bauteil
# den Browser-Client benutzt — an dem Tag, an dem eines das tut, wäre ein
# CI-Artefakt ein still kaputtes Bündel mit grünem Haken.

name: Prüfungen

on:
  # Jeder Zweig, nicht nur main. Wer allein arbeitet, schiebt auf einen Zweig
  # und will ihn geprüft haben — und ohne das lässt sich nicht belegen, dass
  # dieser Ablauf überhaupt anschlägt, ohne main dafür rot zu machen.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Genau einmal, an der Wurzel, ohne --workspace. Der Arbeitsbereich löst
      # sich von dort auf; ein Install im Unterverzeichnis holt die falschen
      # Versionen. (engine/package-lock.json nagelte vitest 2.1.9 fest — samt
      # der zwei kritischen Verwundbarkeiten — und ist deshalb gelöscht.)
      - name: Abhängigkeiten
        run: npm ci

      # Vor allem anderen: Womit wird hier eigentlich gebaut?
      #
      # Dieses Projekt hatte schon einmal zwei kritische Verwundbarkeiten in
      # einer festgenagelten Testbibliothek — gefunden, weil jemand hinsah,
      # nicht weil etwas anschlug. Bei einem Produkt mit Gesundheitsdaten ist
      # das die falsche Reihenfolge.
      - name: Abhängigkeiten — bekannte Schwachstellen
        run: npm audit --audit-level=high

      # Einzeln benannt, damit die Zusammenfassung zeigt, was tatsächlich
      # geprüft wurde — und nicht ein grüner Haken für alles steht.
      - name: Motor — Typen
        run: npm run typecheck --workspace=engine

      # `coverage` und nicht `test`: dieselbe Suite plus die Schwellen. Darin
      # steckt die 100-%-Zweigabdeckung auf src/rules/**, mit der die README
      # wirbt und die vorher von keiner Kette erreicht wurde.
      # Ohne Zahl im Namen: Die stand hier auf 316, als es 364 waren. Eine
      # Zahl, die niemand nachzieht, ist eine Behauptung — und die Ausgabe des
      # Laufs nennt sie ohnehin.
      - name: Motor — Tests und Abdeckungsschwellen
        run: npm run coverage --workspace=engine

      # Enthält den Prerender-Wächter: nichts, was von der anmeldenden Person
      # abhängt, darf in eine statische Datei gebacken werden.
      - name: App — Build und Prerender-Wächter
        run: npm run build --workspace=web

      # Zwei Umgebungen, seit Woche 2. `rein` prüft Entscheidungen ohne
      # Dokument — welcher Wert zulässig ist, welche Sprache ein Pfad bekommt.
      # `bauteile` prüft, was tatsächlich auf dem Bildschirm steht; sechs der
      # acht Funde der Härtungswoche lagen dort und in keinem Modul.
      #
      # NICHT `vitest run` DIREKT, und das ist hier besonders wichtig: Ein Pool,
      # der nicht startet, beendet vitest mit 0. Beim ersten kalten Lauf ist
      # genau das passiert — das jsdom-Projekt lief nicht, der Lauf meldete
      # grün. CI hat bei JEDEM Lauf einen kalten Cache. `run-tests.ts` vergleicht
      # deshalb die Testdateien auf der Platte mit denen, die einen Befund
      # gemeldet haben.
      - name: App — Tests, reine und Bauteile
        run: npm run test --workspace=web

      # NACH dem Build, mit Absicht. Erst dann existiert .next/types, und die
      # von Next erzeugten Routen-Prüfer sind mit im Programm. Derselbe Befehl,
      # strikt mehr geprüft, und er kostet nichts, weil der Build schon lief.
      - name: App — Typen
        run: npm run typecheck --workspace=web

      # NACH dem Build, weil Punkt 4 die Client-Bündel durchsucht — die gibt es
      # vorher nicht. Der Service-Role-Schlüssel umgeht JEDE Zugriffsregel; seit
      # Karte 2.2 hat er wieder einen Benutzer, also auch wieder einen Wächter.
      #
      # In CI sagt diese Prüfung WENIGER als lokal, und sie sagt das selbst:
      # Punkt 5 vergleicht den echten Wert aus .env.local gegen den Build, und
      # den gibt es hier nicht. Was hier läuft, ist die Eindämmung — eine Datei,
      # server-only, zwei Tabellen, kein Lesen, kein Bündel.
      - name: App — der Service-Role-Schlüssel bleibt eingedämmt
        run: npm run check:service-role --workspace=web

      # Die Motorsätze dürfen in keiner App-Datei auftauchen. Die Wortwahl ist
      # hier eine regulatorische Grenze, keine Geschmacksfrage. Eigener Schritt,
      # seit sie nicht mehr in `typecheck` versteckt ist.
      - name: App — Wortgrenze
        run: npm run check:boundary --workspace=web

      # Englisch führt, geschrieben wird zuerst auf Deutsch — der kürzeste Weg
      # von einem deutschen Satz in ein englisches Feld ist Kopieren-und-
      # vergessen. Das fällt niemandem auf, der die App auf Deutsch benutzt,
      # und genau der Person, die sie zum ersten Mal auf Englisch öffnet.
      # Deckt Wörterbuch UND Motorsätze ab; beide Gegenproben laufen mit.
      - name: App — kein Deutsch in der englischen Fassung
        run: npm run check:language --workspace=web

      # Die Gegenrichtung zur Wortgrenze: Jeder Satz, der IM Wörterbuch steht,
      # muss auch irgendwo herauskommen. 18 Einträge taten das nicht — darunter
      # der einzige Satz, der einen stillen Profilwechsel benannt hätte.
      # Aufgelöst über den Typprüfer; eine Namenssuche fand nur 7 davon.
      - name: App — jeder Wörterbucheintrag kommt an
        run: npm run check:dictionary --workspace=web

      # Vor Karte A1 standen 75 Schriftgrössen verstreut im Code — darunter FÜNF
      # verschiedene Werte für »kleiner Text« (0.8, 0.85, 0.88, 0.9, 0.92 rem)
      # in 54 Verwendungen. Keiner davon war eine Entscheidung. Eine Skala hält
      # das nur auf, solange niemand daneben schreibt, und daneben schreibt man
      # nicht aus Nachlässigkeit, sondern weil eine Stelle gerade einen Tick
      # kleiner aussehen soll.
      #
      # Prüft ausserdem den stillen Fall: `var(--text-md)` gibt es nicht, CSS
      # wirft dafür keinen Fehler, und der Text erbt einfach die Grösse seines
      # Elternelements.
      - name: App — die Skala hält
        run: npm run check:tokens --workspace=web

      # Kontrast lässt sich nicht ansehen: Zwei Paare, die auf einem guten
      # Monitor beide »gut lesbar« aussehen, können 6:1 und 3:1 sein. Sechs von
      # dreissig lagen unter AA, darunter die Farbe JEDER Formularwarnung.
      # Beide Themen, hell und dunkel — die dunkle Palette ist eine eigene.
      - name: App — Kontrast nach WCAG AA
        run: npm run check:contrast --workspace=web

      # Die Dokumente tragen die Begründungen dieses Projekts. Eine Zahl darin,
      # die niemand nachzieht, schlägt nirgends fehl und sieht weiter richtig
      # aus — 14 solcher Zahlen standen in fünf Dateien, zwei davon erst seit
      # dieser Woche falsch. Zählt die wahren Werte selbst und vergleicht.
      - name: Dokumente — keine veraltete Zahl
        run: npm run check:docs
